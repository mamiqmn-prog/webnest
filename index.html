<style>
:root{
  color-scheme:dark;
  --bg:#120F0D;
  --bg-2:#1B1612;
  --line:#2E261F;
  --line-2:#463B30;
  --ink:#F1EBE0;
  --ink-2:#BDB2A2;
  --ink-3:#8F8578;
  --egg:#86D3C8;
  --egg-ink:#0E1B18;
  --twig:#D9A066;
  --font-display:'Fraunces', Georgia, 'Times New Roman', serif;
  --font-body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:clip;}
a{color:inherit;text-decoration:none;}
button,input,select,textarea{font-family:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--egg);outline-offset:3px;}
/* Yatay boşluk yalnızca .wrap'ten gelir; diğer bileşenler sadece padding-block kullanır. */
.wrap{max-width:1120px;margin-inline:auto;padding-inline:20px;}

/* ---------- Üst çubuk ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--line);}
.topbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;}
.brand{display:flex;align-items:center;gap:8px;}
.brand-word{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:-0.02em;line-height:1;}
.brand-word::after{content:"";display:inline-block;width:0.2em;height:0.28em;margin-left:0.07em;background:var(--egg);border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;}
.nav{display:flex;gap:4px;}
.nav a{padding:8px 10px;font-size:14px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;}
.nav a:hover{color:var(--ink);}
.nav a.active{color:var(--egg);border-bottom-color:var(--egg);}
@media (min-width:721px){ .nav a{padding:8px 14px;font-size:15px;} .nav{gap:8px;} }

/* ---------- Düğmeler ve bağlantılar ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:15px 28px;border-radius:999px;font-weight:700;font-size:15px;border:1.5px solid transparent;text-align:center;}
.btn-egg{background:var(--egg);color:var(--egg-ink);border-color:var(--egg);}
.btn-cream{background:var(--ink);color:var(--bg);border-color:var(--ink);}
.btn:hover{filter:brightness(1.08);}
.btn-row{display:flex;gap:12px;flex-wrap:wrap;}
.btn-row .btn{flex:1 1 150px;max-width:220px;}
.tlink{color:var(--egg);font-weight:700;font-size:15px;border-bottom:1.5px solid var(--egg);padding-bottom:1px;}
.tlink:hover{color:var(--ink);border-color:var(--ink);}

/* ---------- Ana sayfa: giriş ---------- */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);}
.hero-in{position:relative;z-index:1;padding-block:52px 60px;display:grid;gap:44px;}
.hero-text{min-width:0;}
.hero-shot{margin:0;min-width:0;}
.hero-shot figcaption{margin-top:14px;font-size:14px;color:var(--ink-3);display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
.browser{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--bg-2);}
.browser-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line-2);}
.browser-bar i{width:9px;height:9px;border-radius:50%;background:var(--line-2);flex-shrink:0;}
.browser-bar span{margin-left:8px;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.browser .frame{border:0;border-radius:0;}
svg.frame-fallback{width:100%;height:100%;display:block;}
.hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(44px,7vw,80px);line-height:0.98;letter-spacing:-0.03em;margin:0 0 22px;max-width:16ch;text-wrap:balance;}
.hero p.lede{font-size:clamp(16px,2.2vw,19px);color:var(--ink-2);max-width:46ch;margin:0 0 30px;}
@media (min-width:961px){
  .hero-in{grid-template-columns:1.05fr 1fr;align-items:center;gap:56px;padding-block:80px 88px;}
}
@keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;}
.rise.d1{animation-delay:.05s;} .rise.d2{animation-delay:.18s;} .rise.d3{animation-delay:.3s;}
@media (prefers-reduced-motion: reduce){ .rise{opacity:1;animation:none;} }

/* ---------- Bölümler ---------- */
.section{padding-block:60px;border-bottom:1px solid var(--line);}
.section h2{font-family:var(--font-display);font-weight:700;font-size:clamp(28px,4.6vw,44px);line-height:1.08;letter-spacing:-0.02em;margin:0 0 10px;}
.section .sub{color:var(--ink-2);margin:0 0 28px;max-width:52ch;}
.page-head{padding-block:52px 12px;}
.page-head h1{font-family:var(--font-display);font-weight:800;font-size:clamp(38px,7.5vw,72px);line-height:1;letter-spacing:-0.03em;margin:0 0 14px;}
.page-head p{color:var(--ink-2);font-size:17px;max-width:52ch;margin:0;}

/* ---------- İş önizlemesi ---------- */
.work{display:grid;grid-template-columns:1.5fr 1fr;gap:28px 40px;align-items:center;}
.work + .work{margin-top:56px;}
.frame{position:relative;aspect-ratio:16/10;overflow:hidden;border:1px solid var(--line-2);border-radius:14px;background:var(--bg-2);}
.frame-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:14px;}
.frame iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none;background:#fff;}
.frame-link{position:absolute;inset:0;z-index:2;}
.work-type{font-size:14px;color:var(--twig);font-weight:700;margin:0 0 6px;}
.work h3{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,4.5vw,44px);line-height:1.05;letter-spacing:-0.02em;margin:0 0 12px;}
.work p.desc{color:var(--ink-2);margin:0 0 20px;}
.work-links{display:flex;gap:22px;flex-wrap:wrap;align-items:center;}
@media (max-width:820px){ .work{grid-template-columns:1fr;} }
.invite{margin-top:56px;padding-block:34px;border-top:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;}
.invite h3{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0 0 4px;letter-spacing:-0.01em;}
.invite p{margin:0;color:var(--ink-2);max-width:44ch;}

/* ---------- Ne yapıyoruz ---------- */
.kinds{list-style:none;margin:0;padding:0;}
.kinds li{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:8px 40px;padding-block:26px;border-top:1px solid var(--line);align-items:start;}
.kinds li:last-child{border-bottom:1px solid var(--line);}
.kinds strong{font-family:var(--font-display);font-weight:600;font-size:clamp(22px,3vw,30px);letter-spacing:-0.01em;}
.kinds span{color:var(--ink-2);line-height:1.65;}
@media (max-width:720px){ .kinds li{grid-template-columns:1fr;} }

/* ---------- Fiyat özeti (ana sayfa) ---------- */
.price-lines{list-style:none;margin:0 0 26px;padding:0;}
.price-lines li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-block:16px;border-top:1px solid var(--line);}
.price-lines li:last-child{border-bottom:1px solid var(--line);}
.price-lines .n{font-family:var(--font-display);font-weight:600;font-size:clamp(20px,2.8vw,26px);}
.price-lines .p{color:var(--egg);font-weight:800;white-space:nowrap;}

/* ---------- Fiyatlar sayfası ---------- */
.tiers{margin-top:28px;}
.tier{display:grid;grid-template-columns:1.1fr 1.2fr auto;gap:20px 36px;align-items:start;padding-block:32px;border-top:1px solid var(--line-2);}
.tier:last-child{border-bottom:1px solid var(--line-2);}
.tier h2{font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-0.01em;margin:0 0 8px;}
.tier .desc{color:var(--ink-2);font-size:15px;margin:0;}
.tier ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:15px;}
.tier li{display:flex;gap:10px;align-items:flex-start;}
.tier li::before{content:"";flex:0 0 7px;height:7px;border-radius:50%;background:var(--egg);margin-top:8px;}
.tier-price{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:190px;}
.tier-price .from{font-size:13px;color:var(--ink-3);}
.tier-price .amount{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1;letter-spacing:-0.02em;margin-bottom:14px;}
@media (max-width:820px){
  .tier{grid-template-columns:1fr;gap:18px;padding-block:28px;}
  .tier-price{min-width:0;width:100%;}
  .tier-price .btn{width:100%;}
}
.notes{padding-block:40px;display:grid;grid-template-columns:1fr 1fr;gap:32px;}
.notes h3{font-family:var(--font-display);font-weight:700;font-size:22px;margin:0 0 12px;}
.notes p,.notes li{color:var(--ink-2);font-size:15px;margin:0;}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;}
@media (max-width:720px){ .notes{grid-template-columns:1fr;} }

/* ---------- İletişim ---------- */
.contact{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;padding-block:32px 72px;align-items:start;}
@media (max-width:820px){ .contact{grid-template-columns:1fr;gap:32px;} }
.contact.solo{grid-template-columns:minmax(0,560px);}
.field{margin-bottom:18px;}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px;}
.field input,.field select,.field textarea{width:100%;padding:14px 16px;background:var(--bg-2);color:var(--ink);border:1px solid var(--line-2);border-radius:10px;font-size:16px;}
.field textarea{min-height:140px;resize:vertical;line-height:1.5;}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--egg);outline-offset:1px;border-color:var(--egg);}
.contact-side h2{font-family:var(--font-display);font-weight:700;font-size:26px;margin:0 0 10px;}
.contact-side p{color:var(--ink-2);margin:0 0 16px;}
.contact-side .tlink{display:inline-block;margin-right:18px;margin-bottom:10px;}
form .btn{width:100%;max-width:none;border:1.5px solid var(--egg);}
form .btn:disabled{opacity:.6;cursor:default;}

.custom{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:36px 56px;align-items:start;}
.custom .sub{margin-bottom:24px;}
.custom-list{list-style:none;margin:0;padding:0;}
.custom-list li{padding-block:20px;border-top:1px solid var(--line-2);}
.custom-list li:first-child{padding-top:0;border-top:0;}
.custom-list strong{display:block;font-family:var(--font-display);font-weight:600;font-size:22px;letter-spacing:-0.01em;margin-bottom:6px;}
.custom-list span{color:var(--ink-2);line-height:1.65;}
@media (max-width:820px){ .custom{grid-template-columns:1fr;} }
.prose{max-width:68ch;padding-block:24px 72px;}
.prose h2{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-0.01em;margin:38px 0 10px;}
.prose p,.prose li{color:var(--ink-2);line-height:1.7;margin:0 0 12px;}
.prose ul{margin:0 0 12px;padding-left:20px;}
.prose li{margin-bottom:8px;}
.prose strong{color:var(--ink);}
.prose .note{font-size:13px;color:var(--ink-3);margin-top:34px;}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}
.notice{margin-top:16px;padding:14px 16px;border-radius:10px;font-size:15px;line-height:1.6;color:var(--ink);border:1px solid var(--egg);background:rgba(134,211,200,.14);background:color-mix(in srgb, var(--egg) 14%, transparent);}
.notice.err{border-color:#D9846B;background:rgba(217,132,107,.14);background:color-mix(in srgb, #D9846B 14%, transparent);}
.social-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
.pill{display:inline-flex;align-items:center;padding:10px 22px;border-radius:999px;border:1.5px solid var(--egg);background:transparent;color:var(--egg);font-weight:700;font-size:15px;}
.pill:hover{background:var(--egg);color:var(--egg-ink);}

/* ---------- Kapanış çağrısı ---------- */
.cta{padding-block:64px 72px;}
.cta h2{font-family:var(--font-display);font-weight:800;font-size:clamp(32px,6vw,56px);line-height:1.02;letter-spacing:-0.03em;margin:0 0 14px;max-width:16ch;text-wrap:balance;}
.cta p{color:var(--ink-2);margin:0 0 26px;max-width:46ch;}

/* ---------- Alt bilgi ---------- */
footer{border-top:1px solid var(--line);background:var(--bg-2);}
.foot{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-block:36px 30px;}
.foot p{margin:10px 0 0;color:var(--ink-3);font-size:14px;max-width:34ch;}
.foot ul{list-style:none;margin:0;padding:0;display:flex;gap:22px;flex-wrap:wrap;align-self:flex-start;}
.foot ul a{color:var(--ink-2);font-weight:600;font-size:15px;}
.foot ul a:hover{color:var(--egg);}
.copy{padding-block:0 28px;color:var(--ink-3);font-size:13px;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:200;max-width:calc(100% - 32px);text-align:center;}
.toast.show{opacity:1;}
@media (prefers-reduced-motion: reduce){ .toast{transition:none;} }
</style>
</head>

function toast(msg){

/* ---------- Teklif isteği: Supabase'deki "teklifler" tablosuna kaydolur ---------- */
async function saveQuote(row){
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 12000);
  try{
    const res = await fetch(CONFIG.supabaseUrl + '/rest/v1/teklifler', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': CONFIG.supabaseKey,
        'Prefer': 'return=minimal'
      },
      body: JSON.stringify(row),
      signal: ctrl.signal
    });
    if(!res.ok) throw new Error('HTTP ' + res.status);
  } finally {
    clearTimeout(timer);
  }
}

  </div>`;
}
const ro = window.ResizeObserver ? new ResizeObserver(es=>es.forEach(e=>scaleFrame(e.target))) : null;
function scaleFrame(f){
  const ifr = f.querySelector('iframe');
  if(ifr && f.clientWidth) ifr.style.transform = 'scale(' + (f.clientWidth/1280) + ')';
}
function fitFrames(){
  if(ro) ro.disconnect();
  document.querySelectorAll('.frame').forEach(f=>{ scaleFrame(f); if(ro) ro.observe(f); });
}
window.addEventListener('resize', fitFrames);

/* ---------- Yönlendirme ---------- */
const TITLES = {'':'Webnest — Web sitesi tasarımı', hakkimizda:'Hakkımızda — Webnest', haklar:'Kullanıcı hakları — Webnest', ornekler:'Örnek tasarımlar — Webnest', fiyatlar:'Fiyatlar — Webnest', iletisim:'İletişim — Webnest'};

const USE_HASH = location.protocol === 'file:';   // dosya olarak açılırsa (önizleme) #'li adres kullanılır
let pendingPackage = '';                          // "Teklif al" ile seçilen paket, adrese yazılmaz

function currentPath(){
  if(USE_HASH) return (location.hash.replace(/^#/,'') || '/').split('?')[0];
  // eski #/sayfa bağlantıları temiz adrese çevrilir
  if(location.hash.indexOf('#/') === 0){
    const p = location.hash.slice(1).split('?')[0];
    try{ history.replaceState(null,'',p); }catch(e){}
    return p;
  }
  return location.pathname;
}
function parseRoute(){
  let route = currentPath().split('/').filter(Boolean)[0] || '';
  if(route === 'isler') route = 'ornekler';   // eski adres
  return {route};
}
function navigate(path){
  if(USE_HASH){ location.hash = '#' + path; return; }
  if(location.pathname === path){ render(); return; }
  try{ history.pushState(null,'',path); }
  catch(e){ location.hash = '#' + path; return; }
  render();
}
function fixLinks(root){
  if(!USE_HASH) return;
  root.querySelectorAll('a[data-link]').forEach(a=>a.setAttribute('href','#'+a.dataset.link));
}
document.addEventListener('click', e=>{
  const soon = e.target.closest ? e.target.closest('[data-soon]') : null;
  if(soon){ toast(soon.dataset.soon + ' hesabı yakında eklenecek.'); return; }
  const a = e.target.closest ? e.target.closest('a[data-link]') : null;
  if(!a) return;
  if(e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  if(a.dataset.paket) pendingPackage = a.dataset.paket;
  navigate(a.dataset.link);
});

function render(){
  const {route} = parseRoute();
  const app = $('app');
  let html;
  if(route==='ornekler') html = pageWorks();
  else if(route==='fiyatlar') html = pagePrices();
  else if(route==='iletisim') html = pageContact(pendingPackage);
  else if(route==='hakkimizda') html = pageAbout();
  else if(route==='haklar') html = pageRights();
  else html = pageHome();
  app.innerHTML = html;
  if(route==='iletisim') pendingPackage = '';
  fixLinks(document);
  document.title = TITLES[route] || TITLES[''];
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active', a.dataset.route===route));
  window.scrollTo({top:0, behavior:'auto'});
  fitFrames();

  const form = $('quote-form');
  if(form){
    const notice = $('q-notice');
    const showNotice = (kind, html)=>{
      notice.className = 'notice' + (kind === 'err' ? ' err' : '');
      notice.innerHTML = html;
      notice.hidden = false;
      if(notice.scrollIntoView) notice.scrollIntoView({block:'nearest', behavior:'smooth'});
    };
    const okHTML = '<strong>Mesajınız alındı.</strong> En kısa sürede, yazdığınız X veya Instagram hesabından sizinle iletişime geçeceğiz.';

    form.addEventListener('submit', async e=>{
      e.preventDefault();
      const handle = $('q-handle').value.trim();
      if(!handle){
        showNotice('err', 'Instagram veya X kullanıcı adınızı yazın.');
        $('q-handle').focus();
        return;
      }
      const pkg = $('q-pkg').value;
      const msg = $('q-msg').value.trim();
      const btn = $('q-submit');

      // Gizli alanı bir bot doldurduysa gönderme, ama başarılıymış gibi davran
      if($('q-website').value){ form.reset(); showNotice('ok', okHTML); return; }

      notice.hidden = true;
      btn.disabled = true;
      btn.textContent = 'Gönderiliyor';
      try{
        await saveQuote({
          kullanici_adi: handle.slice(0,100),
          paket: pkg ? pkg.slice(0,60) : null,
          mesaj: msg ? msg.slice(0,2000) : null
        });
        form.reset();                       // yazılanlar sıfırlanır
        btn.textContent = 'Teklif al';
        showNotice('ok', okHTML);
        setTimeout(()=>{ btn.disabled = false; }, 8000);   // üst üste gönderimi önler
      }catch(err){
        console.error(err);
        btn.disabled = false;
        btn.textContent = 'Teklif al';
        showNotice('err', 'Gönderilemedi. Lütfen biraz sonra tekrar deneyin.');
      }
    });
  }
}

(function(){
  const ul = $('foot-links');
  if(!ul) return;
  if(igHandle) ul.insertAdjacentHTML('beforeend', `<li><a href="https://instagram.com/${encodeURIComponent(igHandle)}" target="_blank" rel="noopener">Instagram</a></li>`);
  if(xHandle) ul.insertAdjacentHTML('beforeend', `<li><a href="https://x.com/${encodeURIComponent(xHandle)}" target="_blank" rel="noopener">X</a></li>`);
})();

$('year').textContent = new Date().getFullYear();
window.addEventListener('popstate', render);
if(USE_HASH) window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
